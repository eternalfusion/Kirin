name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check the tag against gradle.properties
        id: version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build the Fabric and NeoForge jars
        run: ./gradlew build
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Kirin ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
