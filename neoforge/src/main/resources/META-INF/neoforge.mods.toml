license="MIT"
issueTrackerURL="https://github.com/MineLittlePony/Kirin/issues"

[[mods]]
modId="kirin"
version="${version}"
displayName="Kirin UI"
displayURL="https://minelittlepony-mod.com/"
iconFile="kirin_logo.png"
authors="Sollace"
description='''Embedded common code used across several Mine Little Pony projects to create their GUIs.'''

[[mixins]]
config="kirin.mixin.json"

[[dependencies.kirin]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.kirin]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
